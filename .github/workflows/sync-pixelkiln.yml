name: Sync pixelkiln skill from source

# PixelKiln is the source of truth for this skill. This workflow watches its
# public releases, so the source repository does not need a token that can
# write to gfargo/skills.

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  SOURCE_REPO: gfargo/pixelkiln
  SOURCE_SKILL_PATH: skills/pixelkiln
  DEST_SKILL_PATH: plugins/games/skills/pixelkiln
  PLUGIN_JSON: plugins/games/.claude-plugin/plugin.json
  MARKETPLACE_JSON: .claude-plugin/marketplace.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gfargo/skills
        uses: actions/checkout@v4

      - name: Check latest PixelKiln release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${SOURCE_REPO}/releases/latest" --jq '.tag_name')
          current=$(cat "${DEST_SKILL_PATH}/.source-version" 2>/dev/null || echo "none")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pixelkiln: current=$current latest=$latest"

      - name: Fetch source at latest tag
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git clone --depth 1 --branch "${{ steps.check.outputs.latest }}" \
            "https://github.com/${SOURCE_REPO}.git" /tmp/source
          if [ ! -d "/tmp/source/${SOURCE_SKILL_PATH}" ]; then
            echo "::error::${SOURCE_SKILL_PATH} does not exist at tag ${{ steps.check.outputs.latest }}"
            exit 1
          fi

      - name: Mirror skill content
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          rsync -a --delete "/tmp/source/${SOURCE_SKILL_PATH}/" "${DEST_SKILL_PATH}/"
          echo "${{ steps.check.outputs.latest }}" > "${DEST_SKILL_PATH}/.source-version"

      - name: Bump games plugin version
        if: steps.check.outputs.up_to_date == 'false'
        id: bump
        run: |
          old=$(jq -r '.version' "${PLUGIN_JSON}")
          IFS='.' read -r major minor patch <<< "$old"
          new="${major}.${minor}.$((patch + 1))"
          jq --arg v "$new" '.version = $v' "${PLUGIN_JSON}" > "${PLUGIN_JSON}.tmp" && mv "${PLUGIN_JSON}.tmp" "${PLUGIN_JSON}"
          jq --arg v "$new" '(.plugins[] | select(.name == "games") | .version) = $v' "${MARKETPLACE_JSON}" > "${MARKETPLACE_JSON}.tmp" && mv "${MARKETPLACE_JSON}.tmp" "${MARKETPLACE_JSON}"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DEST_SKILL_PATH}" "${PLUGIN_JSON}" "${MARKETPLACE_JSON}"
          git commit -m "sync: pixelkiln ${{ steps.check.outputs.latest }} (games v${{ steps.bump.outputs.new_version }})"
          git tag "games-v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "games-v${{ steps.bump.outputs.new_version }}"

      - name: Create release
        if: steps.check.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "games-v${{ steps.bump.outputs.new_version }}" \
            --title "games v${{ steps.bump.outputs.new_version }} — pixelkiln ${{ steps.check.outputs.latest }}" \
            --notes "Synced \`games:pixelkiln\` to [gfargo/pixelkiln@${{ steps.check.outputs.latest }}](https://github.com/${SOURCE_REPO}/releases/tag/${{ steps.check.outputs.latest }})"
